name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # support.py imports win32com.client (pywin32) at module load time,
    # so tests can only run on a Windows runner.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run pytest
        run: pytest

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
