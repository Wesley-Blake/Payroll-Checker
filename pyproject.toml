[project]
name = "payroll-checker"
version = "0.1.0"
description = "Windows CLI tool that audits biweekly payroll timesheet exports and emails affected employees/approvers via Outlook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "validators",
    "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
