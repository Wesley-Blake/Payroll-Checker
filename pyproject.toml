[project]
name = "payroll_checker"
version = "0.1.1"
description = "Windows CLI tool that audits biweekly payroll timesheet exports and emails affected employees/approvers via Outlook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "validators",
    "pywin32>=312; platform_system == 'Windows'",
    "sv-ttk>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
]
# The GUI's dark theming (Windows 11-style ttk look). Kept separate
# from `dependencies` so the CLI stays installable without pulling in GUI
# libraries. pywinstyles darkens the native window title bar to match --
# it's ctypes-based (Windows-only) and a no-op if it fails to load.
gui = [
    "sv-ttk",
    "pywinstyles; platform_system == 'Windows'",
]
# Packaging the GUI into a standalone .exe -- see payroll_checker_gui.spec and
# the "Building a standalone .exe" section in README.md. Kept separate from
# 'dev' since a normal dev/test install doesn't need PyInstaller.
build = [
    "pyinstaller",
]

[project.scripts]
payroll-checker = "payroll_checker.cli.main:main"
payroll-checker-gui = "payroll_checker.gui.app:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
