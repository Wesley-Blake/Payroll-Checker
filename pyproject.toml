[project]
name = "payroll_checker"
version = "0.1.1"
description = "Windows CLI tool that audits biweekly payroll timesheet exports and emails affected employees/approvers via Outlook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "validators",
    "pywin32; platform_system == 'Windows'",
    "pywin32>=312",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff==0.15.22",
]
# Packaging the GUI into a standalone .exe -- see payroll_checker_gui.spec
# and the "Building a standalone .exe" section in README.md. Kept separate
# from `dev` since a normal dev/test install doesn't need PyInstaller.
build = [
    "pyinstaller",
]

[project.scripts]
payroll-checker = "payroll_checker.main:main"
payroll-checker-gui = "payroll_checker.gui.app:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
