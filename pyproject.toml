[project]
name = "payroll_checker"
version = "0.1.1"
description = "Windows CLI tool that audits biweekly payroll timesheet exports and emails affected employees/approvers via Outlook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "validators",
    "pywin32; platform_system == 'Windows'",
    "pywin32>=312",
]
[project.scripts]
payroll_checker = "__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/payroll_checker"]
